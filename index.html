<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B2436">
<title>Isla Hogar · Alojamiento en San Andrés</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='75'%3E🏝️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --navy-deep:#0B2436;
  --navy:#123049;
  --navy-light:#1A425F;
  --sand:#F3E7CE;
  --sand-dim:#CBB98F;
  --turquoise:#2FC6B4;
  --turquoise-dim:#1E8C7E;
  --coral:#FF6E5E;
  --gold:#F2B441;
  --line:rgba(243,231,206,0.12);
  --font-display:'Baloo 2',system-ui,sans-serif;
  --font-body:'Nunito Sans',system-ui,-apple-system,sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:radial-gradient(ellipse at top, #163A54 0%, var(--navy-deep) 55%, #071620 100%);
  color:var(--sand);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
::selection{background:var(--turquoise);color:var(--navy-deep);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--navy-light);border-radius:8px;}

/* Header */
header{
  padding:18px 16px 14px;
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg, rgba(11,36,54,0.98) 70%, rgba(11,36,54,0.9));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,var(--turquoise),var(--turquoise-dim));
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 14px rgba(47,198,180,0.35);
  flex-shrink:0;
}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.2px;}
.brand p{font-size:11.5px;color:var(--sand-dim);margin-top:1px;}

.tabs{display:flex;gap:8px;margin-top:14px;}
.tab-btn{
  flex:1;padding:10px 8px;border-radius:12px;border:1px solid var(--line);
  background:var(--navy);color:var(--sand-dim);font-family:var(--font-body);font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.2s;
}
.tab-btn.active{background:linear-gradient(135deg,var(--turquoise),var(--turquoise-dim));color:var(--navy-deep);border-color:transparent;}

/* Filters */
.filters{
  padding:14px 16px 4px;display:flex;flex-direction:column;gap:10px;
}
.search-row{position:relative;}
.search-row input{
  width:100%;padding:12px 14px 12px 40px;border-radius:14px;border:1px solid var(--line);
  background:var(--navy);color:var(--sand);font-family:var(--font-body);font-size:14px;
}
.search-row input::placeholder{color:var(--sand-dim);}
.search-row::before{
  content:"🔎";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7;
}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--navy);color:var(--sand-dim);font-size:12.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap;
}
.chip.active{background:var(--gold);color:var(--navy-deep);border-color:transparent;}
.chip.active.op-venta{background:var(--coral);}
.chip.active.op-arriendo{background:var(--turquoise);}

.price-range{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sand-dim);}
.price-range select{
  flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--navy);color:var(--sand);font-family:var(--font-body);font-size:12.5px;
}

.result-count{padding:10px 16px 2px;font-size:12px;color:var(--sand-dim);}
.result-count b{color:var(--turquoise);}

/* Cards */
#listView{padding:10px 16px 90px;display:grid;gap:14px;}
.card{
  background:var(--navy);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  cursor:pointer;transition:.2s;position:relative;
}
.card:active{transform:scale(0.98);}
.card-media{
  height:130px;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:44px;
}
.card-media.apartamento{background:linear-gradient(135deg,#1E5A73,#123049);}
.card-media.casa{background:linear-gradient(135deg,#2A6B4F,#123049);}
.card-media.habitacion{background:linear-gradient(135deg,#6B4E2A,#123049);}
.card-media.lote{background:linear-gradient(135deg,#5A3A73,#123049);}
.badge-op{
  position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.3px;
}
.badge-op.venta{background:var(--coral);color:#fff;}
.badge-op.arriendo{background:var(--turquoise);color:var(--navy-deep);}
.badge-fav{position:absolute;top:10px;right:10px;background:rgba(11,36,54,0.65);border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700;color:var(--gold);}
.card-body{padding:12px 14px 14px;}
.card-title{font-family:var(--font-display);font-weight:700;font-size:15.5px;margin-bottom:3px;}
.card-zone{font-size:12px;color:var(--sand-dim);margin-bottom:8px;display:flex;align-items:center;gap:4px;}
.card-specs{display:flex;gap:12px;font-size:12px;color:var(--sand-dim);margin-bottom:10px;}
.card-price{font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--gold);}
.card-price span{font-size:11px;color:var(--sand-dim);font-weight:600;}

/* Map view */
#mapView{display:none;height:calc(100vh - 230px);position:relative;}
#map{height:100%;width:100%;}
.leaflet-popup-content-wrapper{background:var(--navy);color:var(--sand);border-radius:12px;}
.leaflet-popup-tip{background:var(--navy);}
.popup-title{font-family:var(--font-display);font-weight:700;font-size:13px;margin-bottom:2px;}
.popup-price{color:var(--gold);font-weight:800;font-size:13px;}
.popup-btn{
  margin-top:6px;display:inline-block;background:var(--turquoise);color:var(--navy-deep);
  padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:700;text-decoration:none;
}

/* Empty state */
.empty{padding:60px 20px;text-align:center;color:var(--sand-dim);}
.empty div{font-size:40px;margin-bottom:10px;}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(4,14,22,0.75);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;z-index:100;
}
.overlay.open{display:flex;}
.sheet{
  background:var(--navy-deep);width:100%;max-width:480px;border-radius:22px 22px 0 0;
  max-height:88vh;overflow-y:auto;animation:slideUp .25s ease;
  border-top:1px solid var(--line);
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-media{
  height:180px;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;
}
.sheet-close{
  position:absolute;top:14px;right:14px;background:rgba(11,36,54,0.6);border:none;color:var(--sand);
  width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;
}
.sheet-body{padding:20px;}
.sheet-title{font-family:var(--font-display);font-weight:800;font-size:20px;margin-bottom:4px;}
.sheet-zone{color:var(--sand-dim);font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:5px;}
.sheet-specs{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.spec-pill{background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;text-align:center;}
.spec-pill b{display:block;font-size:15px;color:var(--turquoise);}
.sheet-price{font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--gold);margin-bottom:14px;}
.sheet-desc{font-size:13.5px;line-height:1.6;color:var(--sand);opacity:.9;margin-bottom:18px;}
.sheet-actions{display:flex;gap:10px;}
.btn-wa{
  flex:1;background:linear-gradient(135deg,#25D366,#1CAA52);color:#fff;border:none;padding:14px;
  border-radius:14px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;font-family:var(--font-body);
}
.btn-map{
  background:var(--navy);border:1px solid var(--line);color:var(--sand);padding:14px 18px;border-radius:14px;
  font-weight:700;font-size:13px;cursor:pointer;
}

/* Footer note */
.footer-note{
  position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,var(--navy-deep) 60%,transparent);
  padding:10px 16px 12px;font-size:10.5px;color:var(--sand-dim);text-align:center;z-index:40;pointer-events:none;
}

@media (min-width:640px){
  #listView{grid-template-columns:1fr 1fr;}
}

#paseOverlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99999}
.pase-box{position:relative;background:var(--pase-bg);color:var(--pase-fg);border-radius:16px;padding:26px 22px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.pase-box h2{margin:6px 0 8px;font-size:1.3rem;line-height:1.2}
.pase-box p{margin:0 0 14px;font-size:.92rem;line-height:1.5;opacity:.85}
.pase-tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pase-accent)}
.pase-x{position:absolute;top:10px;right:12px;width:auto;background:none;border:0;color:inherit;font-size:1.1rem;cursor:pointer;padding:6px;opacity:.7}
.pase-box input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(128,128,128,.45);background:transparent;color:inherit;font-size:1rem;text-transform:uppercase;margin-bottom:12px}
.pase-go{width:100%;padding:12px;border:0;border-radius:10px;background:var(--pase-accent);color:var(--pase-accent-fg);font-weight:700;font-size:1rem;cursor:pointer}
.pase-wa{display:block;text-align:center;margin-top:12px;font-size:.88rem;color:var(--pase-accent);text-decoration:none}
.pase-msg{min-height:20px;margin-top:10px;font-size:.85rem;text-align:center}
.pase-pill{width:auto!important;display:inline-block;margin-top:10px;padding:6px 14px;border-radius:100px;font-size:.78rem;font-weight:700;cursor:pointer;background:var(--pill-bg);border:1px solid var(--pill-bd);color:var(--pill-fg);font-family:inherit;letter-spacing:.04em}

:root{--pill-bg:rgba(47,198,180,.14);--pill-bd:#2FC6B4;--pill-fg:#2FC6B4}
.pase-box{font-family:var(--font-body)}
.pase-box h2{font-family:var(--font-display)}
.brand .pase-pill{margin:0 0 0 auto;flex-shrink:0}
.pase-lock{font-style:normal}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">🏝️</div>
    <div>
      <h1 id="paseTap">Isla Hogar</h1>
      <p>Arriendo y venta de alojamiento en San Andrés</p>
    </div>
    <button class="pase-pill" id="paseBtn" type="button"></button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tabList" onclick="switchTab('list')">📋 Lista</button>
    <button class="tab-btn" id="tabMap" onclick="switchTab('map')">🗺️ Mapa</button>
  </div>
</header>

<div class="filters">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Buscar por barrio, título o descripción..." oninput="renderAll()">
  </div>
  <div class="chip-row" id="opChips">
    <div class="chip active" data-val="todos" onclick="setOp(this,'todos')">Todos</div>
    <div class="chip op-arriendo" data-val="arriendo" onclick="setOp(this,'arriendo')">🔑 Arriendo</div>
    <div class="chip op-venta" data-val="venta" onclick="setOp(this,'venta')">🏷️ Venta</div>
  </div>
  <div class="chip-row" id="tipoChips">
    <div class="chip active" data-val="todos" onclick="setTipo(this,'todos')">Todos</div>
    <div class="chip" data-val="apartamento" onclick="setTipo(this,'apartamento')">🏢 Apartamento</div>
    <div class="chip" data-val="casa" onclick="setTipo(this,'casa')">🏠 Casa</div>
    <div class="chip" data-val="habitacion" onclick="setTipo(this,'habitacion')">🛏️ Habitación</div>
    <div class="chip" data-val="lote" onclick="setTipo(this,'lote')">🌴 Lote</div>
  </div>
  <div class="chip-row" id="zonaChips"></div>
  <div class="price-range">
    <span>Precio</span>
    <select id="precioSelect" onchange="renderAll()">
      <option value="0">Cualquier precio</option>
      <option value="1000000">Hasta $1.000.000</option>
      <option value="2000000">Hasta $2.000.000</option>
      <option value="5000000">Hasta $5.000.000</option>
      <option value="15000000">Hasta $15.000.000</option>
      <option value="99999999999">Sin límite</option>
    </select>
  </div>
</div>

<div class="result-count"><b id="countNum">0</b> alojamientos encontrados</div>

<div id="listView"></div>

<div id="mapView">
  <div id="map"></div>
</div>

<div class="footer-note">Catálogo de ejemplo · San Andrés Isla 🌊</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const PROPS = [
  {id:1, titulo:"Apartamento vista mar en Sarie Bay", tipo:"apartamento", operacion:"arriendo", zona:"Sarie Bay", precio:2200000, hab:2, banos:1, area:65, lat:12.5875, lng:-81.7010, desc:"Cómodo apartamento a 3 minutos de la playa, balcón con vista al mar, cocina integral y parqueadero cubierto. Ideal para pareja o familia pequeña.", tel:"573001112233"},
  {id:2, titulo:"Casa amplia con patio en La Loma", tipo:"casa", operacion:"venta", zona:"La Loma", precio:420000000, hab:4, banos:3, area:210, lat:12.5652, lng:-81.7075, desc:"Casa tradicional raizal remodelada, patio grande con árboles frutales, cerca de la iglesia bautista. Excelente para vivienda familiar o alojamiento turístico.", tel:"573001112233"},
  {id:3, titulo:"Habitación privada cerca del Centro", tipo:"habitacion", operacion:"arriendo", zona:"Centro", precio:750000, hab:1, banos:1, area:18, lat:12.5847, lng:-81.7006, desc:"Habitación con baño privado, incluye servicios y wifi, a pasos del Parque Bolívar y del sector comercial. Ideal para estudiantes o trabajadores.", tel:"573002223344"},
  {id:4, titulo:"Apartaestudio en San Luis frente al mar", tipo:"apartamento", operacion:"arriendo", zona:"San Luis", precio:1800000, hab:1, banos:1, area:40, lat:12.4938, lng:-81.7126, desc:"Apartaestudio moderno a un costado de la vía San Luis, terraza con hamaca y vista directa al mar caribe. Perfecto para arriendo turístico o residencia corta.", tel:"573003334455"},
  {id:5, titulo:"Casa con piscina en El Cove", tipo:"casa", operacion:"venta", zona:"El Cove", precio:680000000, hab:5, banos:4, area:320, lat:12.5361, lng:-81.7196, desc:"Espectacular casa de dos plantas con piscina privada y jardín tropical, ubicada en zona tranquila cerca del Hoyo Soplador. Acabados de lujo.", tel:"573004445566"},
  {id:6, titulo:"Lote urbanizable en Sound Bay", tipo:"lote", operacion:"venta", zona:"Sound Bay", precio:180000000, hab:0, banos:0, area:500, lat:12.5590, lng:-81.7230, desc:"Lote plano con escritura al día, cerca de la vía circunvalar, ideal para construir vivienda o proyecto turístico. Servicios públicos disponibles en el sector.", tel:"573005556677"},
  {id:7, titulo:"Apartamento familiar en Centro", tipo:"apartamento", operacion:"venta", zona:"Centro", precio:290000000, hab:3, banos:2, area:95, lat:12.5833, lng:-81.6998, desc:"Apartamento en edificio con vigilancia 24h, a 5 minutos caminando de la playa Spratt Bight, cocina remodelada y balcón amplio.", tel:"573006667788"},
  {id:8, titulo:"Habitación con balcón en Cocoplum", tipo:"habitacion", operacion:"arriendo", zona:"Cocoplum", precio:900000, hab:1, banos:1, area:20, lat:12.5920, lng:-81.6975, desc:"Habitación luminosa con balcón privado, aire acondicionado y acceso a cocina compartida, muy cerca del sector hotelero de Cocoplum.", tel:"573007778899"},
  {id:9, titulo:"Casa raizal en Barrack", tipo:"casa", operacion:"arriendo", zona:"Barrack", precio:3200000, hab:3, banos:2, area:140, lat:12.5793, lng:-81.7042, desc:"Casa de estilo tradicional con terraza y jardín, buena ventilación natural, ubicada en barrio residencial tranquilo cerca del gimnasio de béisbol.", tel:"573008889900"},
  {id:10, titulo:"Apartamento nuevo en Punta Sur", tipo:"apartamento", operacion:"venta", zona:"Punta Sur", precio:350000000, hab:2, banos:2, area:78, lat:12.4560, lng:-81.7215, desc:"Apartamento a estrenar en conjunto cerrado con piscina, cerca de los sitios naturales de Punta Sur. Ideal como segunda vivienda o inversión turística.", tel:"573009990011"},
  {id:11, titulo:"Lote frente a vía en La Loma", tipo:"lote", operacion:"venta", zona:"La Loma", precio:95000000, hab:0, banos:0, area:300, lat:12.5670, lng:-81.7060, desc:"Lote esquinero sobre vía principal, buena topografía, cerca de la Primera Iglesia Bautista, ideal para negocio o vivienda con local comercial.", tel:"573001010101"},
  {id:12, titulo:"Apartaestudio económico en Centro", tipo:"apartamento", operacion:"arriendo", zona:"Centro", precio:1300000, hab:1, banos:1, area:32, lat:12.5820, lng:-81.7020, desc:"Apartaestudio funcional cerca del muelle turístico, ideal para persona sola, incluye internet y agua. A pocas cuadras de la peatonal.", tel:"573002020202"}
];

let filtro = {op:'todos', tipo:'todos', zona:'todos', precio:0};
let currentTab = 'list';
let map, markersLayer;

function zonaEmoji(tipo){
  return {apartamento:'🏢', casa:'🏠', habitacion:'🛏️', lote:'🌴'}[tipo] || '🏡';
}
function fmtCOP(n){
  return '$' + n.toLocaleString('es-CO');
}

function buildZonaChips(){
  const zonas = [...new Set(PROPS.map(p=>p.zona))].sort();
  const wrap = document.getElementById('zonaChips');
  wrap.innerHTML = `<div class="chip active" data-val="todos" onclick="setZona(this,'todos')">📍 Toda la isla</div>` +
    zonas.map(z=>`<div class="chip" data-val="${z}" onclick="setZona(this,'${z}')">${z}</div>`).join('');
}

function setOp(el,val){
  document.querySelectorAll('#opChips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  filtro.op = val;
  renderAll();
}
function setTipo(el,val){
  document.querySelectorAll('#tipoChips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  filtro.tipo = val;
  renderAll();
}
function setZona(el,val){
  document.querySelectorAll('#zonaChips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  filtro.zona = val;
  renderAll();
}

function getFiltered(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const maxP = parseInt(document.getElementById('precioSelect').value) || 0;
  return PROPS.filter(p=>{
    if(filtro.op!=='todos' && p.operacion!==filtro.op) return false;
    if(filtro.tipo!=='todos' && p.tipo!==filtro.tipo) return false;
    if(filtro.zona!=='todos' && p.zona!==filtro.zona) return false;
    if(maxP>0 && p.precio>maxP) return false;
    if(q && !(p.titulo.toLowerCase().includes(q) || p.zona.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderList(){
  const items = getFiltered();
  document.getElementById('countNum').textContent = items.length;
  const view = document.getElementById('listView');
  if(items.length===0){
    view.innerHTML = `<div class="empty" style="grid-column:1/-1;"><div>🏖️</div>No hay alojamientos con esos filtros.<br>Intenta ampliar la búsqueda.</div>`;
    return;
  }
  view.innerHTML = items.map(p=>`
    <div class="card" onclick="openSheet(${p.id})">
      <div class="card-media ${p.tipo}">
        <span class="badge-op ${p.operacion}">${p.operacion==='venta'?'EN VENTA':'EN ARRIENDO'}</span>
        ${zonaEmoji(p.tipo)}
      </div>
      <div class="card-body">
        <div class="card-title">${p.titulo}</div>
        <div class="card-zone">📍 ${p.zona}, San Andrés</div>
        <div class="card-specs">
          ${p.hab>0?`<span>🛏️ ${p.hab}</span>`:''}
          ${p.banos>0?`<span>🚿 ${p.banos}</span>`:''}
          <span>📐 ${p.area} m²</span>
        </div>
        <div class="card-price">${fmtCOP(p.precio)} <span>${p.operacion==='arriendo'?'/ mes':''}</span></div>
      </div>
    </div>
  `).join('');
}

function renderAll(){
  renderList();
  if(currentTab==='map') renderMapMarkers();
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabList').classList.toggle('active', tab==='list');
  document.getElementById('tabMap').classList.toggle('active', tab==='map');
  document.getElementById('listView').style.display = tab==='list' ? 'grid' : 'none';
  document.getElementById('mapView').style.display = tab==='map' ? 'block' : 'none';
  if(tab==='map'){
    if(!map) initMap();
    setTimeout(()=>{ map.invalidateSize(); renderMapMarkers(); }, 50);
  }
}

function initMap(){
  map = L.map('map', {zoomControl:true}).setView([12.545,-81.71], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:18, attribution:'© OpenStreetMap'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

function renderMapMarkers(){
  if(!markersLayer) return;
  markersLayer.clearLayers();
  const items = getFiltered();
  items.forEach(p=>{
    const color = p.operacion==='venta' ? '#FF6E5E' : '#2FC6B4';
    const icon = L.divIcon({
      html:`<div style="background:${color};width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #0B2436;box-shadow:0 2px 6px rgba(0,0,0,.4);"><span style="transform:rotate(45deg);font-size:14px;">${zonaEmoji(p.tipo)}</span></div>`,
      className:'', iconSize:[30,30], iconAnchor:[15,30]
    });
    const marker = L.marker([p.lat,p.lng], {icon}).addTo(markersLayer);
    marker.bindPopup(`
      <div class="popup-title">${p.titulo}</div>
      <div class="popup-price">${fmtCOP(p.precio)}${p.operacion==='arriendo'?' / mes':''}</div>
      <div style="font-size:11.5px;color:#CBB98F;margin-top:2px;">📍 ${p.zona}</div>
      <a class="popup-btn" href="#" onclick="closeAllPopups(); openSheet(${p.id}); return false;">Ver detalles</a>
    `);
  });
}
function closeAllPopups(){ if(map) map.closePopup(); }

function openSheet(id){
  const p = PROPS.find(x=>x.id===id);
  if(!p) return;
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="sheet-media ${p.tipo}" style="background:${p.tipo==='apartamento'?'linear-gradient(135deg,#1E5A73,#123049)':p.tipo==='casa'?'linear-gradient(135deg,#2A6B4F,#123049)':p.tipo==='habitacion'?'linear-gradient(135deg,#6B4E2A,#123049)':'linear-gradient(135deg,#5A3A73,#123049)'};">
      <span class="badge-op ${p.operacion}" style="position:absolute;top:14px;left:14px;">${p.operacion==='venta'?'EN VENTA':'EN ARRIENDO'}</span>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
      <span style="font-size:56px;">${zonaEmoji(p.tipo)}</span>
    </div>
    <div class="sheet-body">
      <div class="sheet-title">${p.titulo}</div>
      <div class="sheet-zone">📍 ${p.zona}, San Andrés Isla</div>
      <div class="sheet-specs">
        ${p.hab>0?`<div class="spec-pill"><b>${p.hab}</b>Habitaciones</div>`:''}
        ${p.banos>0?`<div class="spec-pill"><b>${p.banos}</b>Baños</div>`:''}
        <div class="spec-pill"><b>${p.area}</b>m² área</div>
      </div>
      <div class="sheet-price">${fmtCOP(p.precio)} <span style="font-size:13px;color:var(--sand-dim);font-weight:600;">${p.operacion==='arriendo'?'/ mes':'· negociable'}</span></div>
      <div class="sheet-desc">${p.desc}</div>
      <div class="sheet-actions">
        <button class="btn-wa" onclick="contactWA(${p.id})">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.55-3.7 8.25-8.24 8.25z"/></svg>
          Contactar por WhatsApp<span class="pase-lock">${paseActive()?'':' 🔒'}</span>
        </button>
        <button class="btn-map" onclick="viewOnMap(${p.id})">🗺️</button>
      </div>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }

function contactWA(id){
  if(!paseActive()){ paseOpen("Contactar al propietario por WhatsApp requiere el Pase Hogar.", ()=>contactWA(id)); return; }
  const p = PROPS.find(x=>x.id===id);
  const msg = encodeURIComponent(`Hola, estoy interesado(a) en el alojamiento "${p.titulo}" (${p.zona}) publicado en Isla Hogar. ¿Sigue disponible?`);
  window.open(`https://wa.me/${p.tel}?text=${msg}`, '_blank');
}

function viewOnMap(id){
  const p = PROPS.find(x=>x.id===id);
  closeSheet();
  switchTab('map');
  setTimeout(()=>{
    map.setView([p.lat,p.lng], 15);
  }, 150);
}


/* ================= PASE PREMIUM =================
   Código sin servidor: el código válido cambia cada mes y se calcula con una
   palabra secreta. Es un candado sencillo para un negocio pequeño, no un
   sistema anti-fraude: alguien con conocimientos técnicos que lea el código
   fuente podría calcularlo. Para tu código del mes: toca 6 veces seguidas el
   título de la app y saldrá en una ventana. */
const PASE = {"id": "hogar", "nombre": "Pase Hogar", "prefijo": "HOGA", "secreto": "ISLAHOGAR-2026-SANANDRES", "whatsapp": "573016079064", "beneficios": "Contacta por WhatsApp al propietario de cualquier alojamiento del catálogo.", "tema": {"--pase-bg": "#123049", "--pase-fg": "#F3E7CE", "--pase-accent": "#2FC6B4", "--pase-accent-fg": "#0B2436"}};
let paseMem = false;
function paseHash(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return h;}
function paseMonthKey(o){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return d.getFullYear()+'-'+(d.getMonth()+1);}
function paseCode(o){return PASE.prefijo+((paseHash(paseMonthKey(o)+PASE.secreto)%900000)+100000);}
function paseValid(c){c=(c||'').trim().toUpperCase().replace(/\s+/g,'');return c===paseCode(0)||c===paseCode(-1);}
function paseActive(){try{return paseMem||localStorage.getItem('pase_'+PASE.id)==='1';}catch(e){return paseMem;}}
function paseActivate(c){
  if(!paseValid(c))return false;
  paseMem=true;
  try{localStorage.setItem('pase_'+PASE.id,'1');}catch(e){}
  return true;
}
function paseClose(){const o=document.getElementById('paseOverlay');if(o)o.remove();}
function paseOpen(motivo,onOk){
  paseClose();
  const o=document.createElement('div');
  o.id='paseOverlay';
  for(const k in PASE.tema){o.style.setProperty(k,PASE.tema[k]);}
  const activo=paseActive();
  o.innerHTML='<div class="pase-box"><button class="pase-x" aria-label="Cerrar">✕</button>'
    +'<span class="pase-tag">'+(activo?'✨ ':'🔓 ')+PASE.nombre+'</span>'
    +(activo
      ?'<h2>Tu pase está activo</h2><p>'+PASE.beneficios+'</p>'
      :'<h2>Desbloquea esta función</h2><p>'+(motivo||PASE.beneficios)+'</p>'
        +'<input id="paseInput" placeholder="Ej: '+PASE.prefijo+'123456" autocomplete="off" autocapitalize="characters">'
        +'<button class="pase-go">Activar</button>'
        +'<a class="pase-wa" target="_blank" rel="noopener" href="https://wa.me/'+PASE.whatsapp+'?text='+encodeURIComponent('Hola! Quiero mi código del '+PASE.nombre)+'">💬 ¿No tienes código? Pídelo aquí</a>'
        +'<div class="pase-msg" id="paseMsg"></div>')
    +'</div>';
  document.body.appendChild(o);
  o.addEventListener('click',e=>{if(e.target===o)paseClose();});
  o.querySelector('.pase-x').onclick=paseClose;
  const go=o.querySelector('.pase-go');
  if(go){
    const intentar=()=>{
      if(paseActivate(document.getElementById('paseInput').value)){
        paseClose();paseRefresh();
        if(onOk)onOk();
      }else{
        const m=document.getElementById('paseMsg');
        m.textContent='Código inválido, verifícalo con quien te lo dio.';
        m.style.color='#e5604d';
      }
    };
    go.onclick=intentar;
    document.getElementById('paseInput').addEventListener('keydown',e=>{if(e.key==='Enter')intentar();});
  }
}
function paseGuard(motivo,fn){
  if(paseActive()){fn();}else{paseOpen(motivo,fn);}
}
function paseRefresh(){
  const b=document.getElementById('paseBtn');
  if(b){b.textContent=(paseActive()?'✨ ':'🔓 ')+PASE.nombre;}
  if(typeof paseRefreshLocks==='function')paseRefreshLocks();
}
let paseTaps=0,paseTapTimer;
function paseSecretTap(id){
  const el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('click',()=>{
    paseTaps++;
    clearTimeout(paseTapTimer);
    paseTapTimer=setTimeout(()=>{paseTaps=0;},3000);
    if(paseTaps>=6){
      paseTaps=0;
      alert('🔑 Código '+PASE.nombre+' de este mes:\n\n'+paseCode(0)+'\n\nEntrégalo solo a quien ya haya pagado.');
    }
  });
}

function paseRefreshLocks(){
  document.querySelectorAll('.pase-lock').forEach(e=>{e.textContent=paseActive()?'':' 🔒';});
}
document.getElementById('paseBtn').onclick=()=>paseOpen();
paseSecretTap('paseTap');
paseRefresh();

// Init
buildZonaChips();
renderAll();

// Service worker for offline app shell
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE='isla-hogar-v1';
    self.addEventListener('install', e=>{ self.skipWaiting(); });
    self.addEventListener('activate', e=>{ self.clients.claim(); });
    self.addEventListener('fetch', e=>{
      if(e.request.url.includes('tile.openstreetmap.org')) return;
      e.respondWith(
        caches.open(CACHE).then(cache=>
          cache.match(e.request).then(res=> res || fetch(e.request).then(fresh=>{
            cache.put(e.request, fresh.clone()); return fresh;
          }).catch(()=>res))
        )
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
